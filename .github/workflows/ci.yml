name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-policy:
    name: Security policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Reject mutable GitHub Action references
        shell: bash
        run: |
          invalid_refs="$(grep -REn '^[[:space:]]*uses:[[:space:]]+[^[:space:]]+@' .github/workflows \
            | grep -Ev '@[0-9a-f]{40}([[:space:]]+#.*)?$' || true)"
          if [[ -n "$invalid_refs" ]]; then
            printf 'GitHub Actions must use immutable commit SHAs:\n%s\n' "$invalid_refs"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test policy enforcement
        run: go test ./internal/securitypolicy ./cmd/security-policy

      - name: Validate policy and active exceptions
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGE_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(
            --policy .github/security/policy.json
            --exceptions .github/security/exceptions.json
          )

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if git cat-file -e "${BASE_SHA}:.github/security/exceptions.json" 2>/dev/null; then
              baseline="$RUNNER_TEMP/base-security-exceptions.json"
              git show "${BASE_SHA}:.github/security/exceptions.json" > "$baseline"
              args+=(--baseline-exceptions "$baseline")
            fi
            args+=(--change-author "$CHANGE_AUTHOR")
          fi

          go run ./cmd/security-policy validate "${args[@]}"

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal pkg)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following Go files require gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet packages
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Reject generated and local runtime files
        shell: bash
        run: |
          forbidden="$({
            git ls-files | grep -E '(^|/)(\.consize|\.gocache|\.next|node_modules|bin|dist)(/|$)|\.jsonl$|fix_css.*\.py$|(^|/)consize$|\.test$' || true
          })"
          if [[ -n "$forbidden" ]]; then
            printf 'Forbidden generated or local files are tracked:\n%s\n' "$forbidden"
            exit 1
          fi

      - name: Reject legacy module references
        shell: bash
        run: |
          if git grep -n 'github.com/consize-oss/consize-0' -- '*.go' go.mod; then
            echo 'Legacy consize-0 module references remain.'
            exit 1
          fi
