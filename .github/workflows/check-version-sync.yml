name: Check version sync

on:
  push:
    branches:
      - main
    paths:
      - "charts/consize/Chart.yaml"
      - "README.md"
      - "_snippets/helm-install-oci.sh"
  pull_request:
    paths:
      - "charts/consize/Chart.yaml"
      - "README.md"
      - "_snippets/helm-install-oci.sh"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check README.md and docs snippet match Chart.yaml
        run: |
          chmod +x scripts/sync-version.sh
          ./scripts/sync-version.sh --check