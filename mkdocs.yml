site_name: Consize
site_url: https://docs.consizehq.com
site_description: Safe, Automated Action for Kubernetes
site_author: Consize OSS
repo_url: https://github.com/consize-oss/consize
repo_name: consize-oss/consize

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Overview: index.md

  - Get started:
      - Get started: getting-started/get-started.md
      - Quickstart: getting-started/quickstart.md
      - Interactive Sandbox: getting-started/sandbox.md
      - Production Installation: getting-started/installation.md

  - Guides:
      - Kubernetes Rightsizing: guides/rightsizing.md
      - Observability: guides/observability.md
      - Environments: guides/environments.md

  - Concepts:
      - How Consize Works: concepts/architecture.md
      - The Safety Net: concepts/safety-net.md

  - Reference:
      - Configuration: reference/configuration.md

  - Contributing:
      - Testing: contributing/testing.md
      - E2E Tests: contributing/e2e.md
      - Decisions: contributing/decisions.md

  - Resources:
      - Roadmap: resources/roadmap.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css