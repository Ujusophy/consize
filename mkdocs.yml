site_name: Consize
site_url: https://docs.consizehq.com
site_description: Safe, Automated Action for Kubernetes
site_author: Consize OSS
repo_url: https://github.com/consize-oss/consize
repo_name: consize-oss/consize
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg       # TODO: add a real logo file — even a simple wordmark beats the default icon
  favicon: assets/favicon.png # TODO: add a favicon
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit   # adds "edit this page" link -> lowers barrier for doc contributions

nav:
  - Overview: index.md

  - Get started:
      - Get started: getting-started/get-started.md
      - Interactive Sandbox: getting-started/sandbox.md
      - Production Installation: getting-started/installation.md

  - Guides:
      - Kubernetes Rightsizing: guides/rightsizing.md
      - Observability: guides/observability.md
      - Environments: guides/environments.md

  - Concepts:
      - How Consize Works: concepts/architecture.md
      - The Safety Net: concepts/safety-net.md

  - Reference:
      - Configuration: reference/configuration.md

  - Contributing:
      - Testing: contributing/testing.md
      - E2E Tests: contributing/e2e.md
      - Decisions: contributing/decisions.md

  - Resources:
      - Roadmap: resources/roadmap.md

markdown_extensions:
  - admonition
  - attr_list        # required for grid cards / button styling
  - md_in_html        # required for grid cards
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/consize-oss/consize
    - icon: fontawesome/brands/discord
      link: https://discord.gg/REPLACE_ME   # TODO: real invite link

extra_css:
  - stylesheets/extra.css