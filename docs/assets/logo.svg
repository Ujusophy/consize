<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Vibrant Green Gradient -->
    <linearGradient id="consizeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    
    <!-- Deep Blue/Dark Gradient -->
    <linearGradient id="consizeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Transparent Background -->
  <rect width="400" height="400" fill="none" />

  <!-- Stacked Icon (Top) -->
  <g transform="translate(200, 160)">
    <!-- Outer Kubernetes-style Hexagon -->
    <path d="M0 -70 L60.62 -35 L60.62 35 L0 70 L-60.62 35 L-60.62 -35 Z" 
          fill="none" 
          stroke="url(#consizeDark)" 
          stroke-width="12" 
          stroke-linejoin="round" />
          
    <!-- Inner Shrinking/Target Box (Represents reduction/cost savings) -->
    <path d="M0 -35 L30.31 -17.5 L30.31 17.5 L0 35 L-30.31 17.5 L-30.31 -17.5 Z" 
          fill="url(#consizeGreen)" />
          
    <!-- Center Node (Represents the core workload) -->
    <circle cx="0" cy="0" r="10" fill="#ffffff" />
  </g>

  <!-- Stacked Text (Bottom) -->
  <text x="200" y="310" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'" 
        font-size="72" 
        font-weight="800" 
        fill="url(#consizeDark)" 
        text-anchor="middle" 
        letter-spacing="-2">
    con<tspan fill="url(#consizeGreen)">Size</tspan>
  </text>
</svg>
